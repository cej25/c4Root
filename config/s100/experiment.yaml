  version: 4
  procid: 80
  whiterabbit: 0x500
  sfp: 0
  boards: [0, 1, 2, 3, 4, 5, 6, 7, 8]

BGO:
  digitiser: tamex
  version: 4
  procid: 100
  whiterabbit: 0x1900
  sfp: 1
  boards: [0, 1, 2]
