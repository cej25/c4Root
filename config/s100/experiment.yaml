# s100 detector electronics. Board indices are local to each procid.
# whiterabbit is the subsystem ID matched by the UCESB timestamp parser.
FATIMA:
  digitiser: tamex
  version: 4
  procid: 75
  whiterabbit: 0x1600

bPlast:
  digitiser: tamex
  version: 4
  procid: 80
  whiterabbit: 0x500

BGO:
  digitiser: tamex
  version: 4
  procid: 100
  whiterabbit: 0x1900
