# s100 electronics layout. Board indices are local to each UCESB subevent.
# Edit this file, then use scripts/sync_experiment.py --experiment s100 --check.
# The unpacker may support more boards than this configuration uses.
# Rebuild the unpacker after editing a White Rabbit ID.
FATIMA:
  subevent: fatima_tamex_subev
  member: fatima
  digitiser: tamex
  version: 4
  procid: 75
  whiterabbit: 0x1600
  sfp: 0
  boards: [0, 1, 2, 3]

bPlast:
  subevent: bplast_subev
  member: bplast
  digitiser: tamex
  version: 4
  procid: 80
  whiterabbit: 0x500
  sfp: 0
  boards: [0, 1, 2, 3, 4, 5, 6, 7, 8]

BGO:
  subevent: bgo_tamex_subevent
  member: bgo
  digitiser: tamex
  version: 4
  procid: 100
  whiterabbit: 0x1900
  sfp: 1
  boards: [0, 1, 2]

# FATIMA VME is a separate UCESB subevent and may run alongside TAMEX.
FATIMA_VME:
  subevent: fatima_vme_subev
  member: fatimavme
  digitiser: vme
  procid: 70
  whiterabbit: 0x1500
  v1751:
    boards: [6, 7, 8, 9, 10]
  v1290:
    boards: [12, 13]

AIDA:
  subevent: aida_subev
  member: aida
  procid: 90
  whiterabbit: 0x700

Germanium:
