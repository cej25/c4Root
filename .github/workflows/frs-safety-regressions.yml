name: Detector standalone safety regressions

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frs-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run FRS safety tests (no ROOT/FairRoot required)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/frs_reader_safety_test.cxx -o /tmp/frs_reader_safety_test
          /tmp/frs_reader_safety_test
      - name: Compile and run FIMP multi-hit safety tests
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/fimp_multihit_safety_test.cxx -o /tmp/fimp_multihit_safety_test
          /tmp/fimp_multihit_safety_test
      - name: Compile and run BB7 FEBEX coordinate safety tests
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/bb7_febex_index_safety_test.cxx -o /tmp/bb7_febex_index_safety_test
          /tmp/bb7_febex_index_safety_test
      - name: Compile and run cluster time-overlap tests
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/cluster_time_overlap_test.cxx -o /tmp/cluster_time_overlap_test
          /tmp/cluster_time_overlap_test
      - name: Compile and run Stefan White Rabbit timestamp tests
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/stefan_timestamp_safety_test.cxx -o /tmp/stefan_timestamp_safety_test
          /tmp/stefan_timestamp_safety_test
