name: Detector standalone safety regressions

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frs-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run all standalone detector safety tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*_test.cxx)
          if (( ${#tests[@]} == 0 )); then
            echo "No standalone detector tests found." >&2
            exit 1
          fi

          for source in "${tests[@]}"; do
            test_name="$(basename "$source" .cxx)"
            binary="${RUNNER_TEMP}/${test_name}"
            echo "::group::${test_name}"
            g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
              -fsanitize=undefined -fno-sanitize-recover=all \
              "$source" -o "$binary"
            "$binary"
            echo "::endgroup::"
          done
