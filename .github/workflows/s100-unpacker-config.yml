name: Experiment UCESB configuration consistency

on:
  pull_request:
  push:
    branches:
      - feature/fatima-tamex-migration

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate s100 experiment electronics against compiled UCESB capacity
        run: python scripts/validate_experiment.py --experiment s100
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
