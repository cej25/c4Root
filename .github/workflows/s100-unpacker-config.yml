name: s100 UCESB configuration consistency

on:
  pull_request:
  push:
    branches:
      - feature/fatima-tamex-migration

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate s100 TAMEX specification and structure headers
        run: python scripts/sync_experiment.py --experiment s100 --check
      - name: Run synchroniser regression tests
        run: python -m unittest discover -s tests -p 'test_sync_experiment.py' -v
