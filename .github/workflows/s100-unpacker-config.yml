name: Experiment UCESB configuration consistency

on:
  pull_request:
  push:
    branches:
      - feature/fatima-tamex-migration

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate s100 experiment electronics against compiled UCESB capacity
        run: python scripts/validate_experiment.py --experiment s100
      - name: Run electronics capacity and synchroniser regression tests
        run: |
          python -m unittest discover -s tests -p 'test_sync_experiment.py' -v
          python -m unittest discover -s tests -p 'test_validate_experiment.py' -v
          python -m unittest discover -s tests -p 'test_audit_caen_words.py' -v
          python -m unittest discover -s tests -p 'test_s100_vme_real_block.py' -v
          python -m unittest discover -s tests -p 'test_s100_vme_lab_spec.py' -v
          python -m unittest discover -s tests -p 'test_s100_vme_tdc_lab_spec.py' -v
          python -m unittest discover -s tests -p 'test_compare_fatima_vme_dumps.py' -v
