name: Generate native DEGAS UNPACK header
on:
  push:
    branches: [validation/ucesb-structure-headers]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flex bison libncurses-dev libtirpc-dev python3-yaml
          export UCESB_BASE_DIR="${RUNNER_TEMP}/ucesb"
          git clone https://git.chalmers.se/expsubphys/ucesb.git "$UCESB_BASE_DIR"
          git -C "$UCESB_BASE_DIR" checkout effbaebdc2ea00e804ac8aea66d71c8b325e1e32
          make -C "$UCESB_BASE_DIR" -j2 empty USE_CURSES=1
          make -C unpack/exps/s100 -j2 s100
          mkdir -p "$RUNNER_TEMP/degas"
          s100="$PWD/unpack/exps/s100/s100"
          cd "$RUNNER_TEMP/degas"
          "$s100" /dev/null --ntuple=NOTRIGEVENTNO,UNPACK:germanium,STRUCT_HH,id=h101_degas,ext_h101_degas.h
          "$s100" /dev/null --ntuple=NOTRIGEVENTNO,UNPACK:germanium,STRUCT,- > degas.struct
          sha256sum ext_h101_degas.h
      - uses: actions/upload-artifact@v4
        with:
          name: native-degas-header
          path: ${{ runner.temp }}/degas/
          if-no-files-found: error
          retention-days: 2
