name: Validate consolidated TAMEX fine-time I/O
on:
  push:
    branches: [validation/ucesb-structure-headers]
permissions:
  contents: read
jobs:
  root:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ROOT
      - name: Round-trip the shared fine-time histogram format
        run: |
          set -euo pipefail
          root_pkg="$(python -c 'from importlib.util import find_spec; from pathlib import Path; print(Path(find_spec("ROOT").origin).parent)')"
          cat > "$RUNNER_TEMP/check.cxx" <<'EOF'
          #include "TamexFineTimeCalibration.h"
          #include "TString.h"
          #include <cassert>
          int main()
          {
              std::vector<std::array<std::uint64_t, 1024>> counts(33);
              counts[0][0] = 2;
              counts[0][5] = 4;
              counts[32][50] = 11;
              const TString path("fine-time.root");
              tamex::WriteFineTimeHistograms(path, counts);
              const auto actual = tamex::ReadFineTimeHistograms(path, 2);
              assert(actual.size() == counts.size());
              for (std::size_t channel = 0; channel < counts.size(); ++channel) {
                  tamex::FineTimeCalibration<> expected;
                  expected.SetCounts(counts[channel]);
                  expected.Calculate();
                  assert(actual[channel] == expected.Times());
              }
          }
          EOF
          tamex=c4source/digitisers/tamex
          g++ -std=c++17 -I"$root_pkg/include" -I"$tamex" "$RUNNER_TEMP/check.cxx" "$tamex/TamexFineTimeCalibration.cxx" -L"$root_pkg/lib" -Wl,-rpath,"$root_pkg/lib" -lCore -lHist -lRIO -o "$RUNNER_TEMP/check"
          export LD_LIBRARY_PATH="$root_pkg/lib:${LD_LIBRARY_PATH:-}"
          "$RUNNER_TEMP/check"
          echo 'PASS: shared TAMEX fine-time histogram I/O'
